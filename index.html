<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Словарный тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-hint: #999999;
            --input-bg: #f5f5f5;
            --input-border: #e0e0e0;
            --input-focus: #667eea;
            --input-correct: #e8f5e9;
            --input-correct-border: #4caf50;
            --input-incorrect: #ffebee;
            --input-incorrect-border: #f44336;
            --feedback-correct: #4caf50;
            --feedback-incorrect: #f44336;
            --progress-bg: #e0e0e0;
            --progress-fill: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --tag-bg: #e8eaf6;
            --tag-color: #667eea;
            --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-hover-shadow: rgba(102, 126, 234, 0.4);
            --word-list-border: #eeeeee;
            --word-item-correct: #4caf50;
            --word-item-incorrect: #f44336;
            --problem-mild-bg: #fff3e0;
            --problem-mild-color: #ff9800;
            --problem-severe-bg: #ffebee;
            --problem-severe-color: #f44336;
            --stats-bg: #f5f5f5;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body.dark-theme {
            --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-card: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-hint: #808080;
            --input-bg: #2a2a3e;
            --input-border: #3a3a4e;
            --input-focus: #8892b0;
            --input-correct: #1b3a2a;
            --input-correct-border: #4caf50;
            --input-incorrect: #3a1b1b;
            --input-incorrect-border: #f44336;
            --feedback-correct: #81c784;
            --feedback-incorrect: #e57373;
            --progress-bg: #2a2a3e;
            --progress-fill: linear-gradient(135deg, #64ffda 0%, #8892b0 100%);
            --tag-bg: #2a2a4e;
            --tag-color: #64ffda;
            --btn-gradient: linear-gradient(135deg, #64ffda 0%, #8892b0 100%);
            --btn-hover-shadow: rgba(100, 255, 218, 0.3);
            --word-list-border: #2a2a3e;
            --word-item-correct: #4caf50;
            --word-item-incorrect: #f44336;
            --problem-mild-bg: #3a2a1a;
            --problem-mild-color: #ff9800;
            --problem-severe-bg: #3a1a1a;
            --problem-severe-color: #f44336;
            --stats-bg: #2a2a3e;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            transition: background 0.3s, box-shadow 0.3s;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 2em;
            transition: color 0.3s;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 2px solid var(--input-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            transition: all 0.3s;
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .start-screen, .game-screen, .result-screen {
            display: none;
        }

        .start-screen.active, .game-screen.active, .result-screen.active {
            display: block;
        }

        .btn {
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            margin: 20px auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--btn-hover-shadow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .progress-bar {
            background: var(--progress-bg);
            border-radius: 10px;
            height: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: background 0.3s;
        }

        .progress-fill {
            background: var(--progress-fill);
            height: 100%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .word-display {
            text-align: center;
            font-size: 2.5em;
            margin: 40px 0;
            letter-spacing: 5px;
            color: var(--text-primary);
            font-weight: bold;
            transition: color 0.3s;
        }

        .word-display .missing-letter {
            color: var(--feedback-incorrect);
            border-bottom: 3px solid var(--feedback-incorrect);
        }

        .input-group {
            margin: 30px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            font-size: 1.8em;
            border: 3px solid var(--input-border);
            border-radius: 10px;
            text-align: center;
            transition: border-color 0.3s, background 0.3s;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--input-focus);
        }

        .input-group input.correct {
            border-color: var(--input-correct-border) !important;
            background: var(--input-correct) !important;
        }

        .input-group input.incorrect {
            border-color: var(--input-incorrect-border) !important;
            background: var(--input-incorrect) !important;
        }

        .feedback {
            text-align: center;
            margin-top: 15px;
            font-size: 1.3em;
            min-height: 35px;
            transition: color 0.3s;
        }

        .feedback.correct {
            color: var(--feedback-correct);
        }

        .feedback.incorrect {
            color: var(--feedback-incorrect);
        }

        .results-summary {
            text-align: center;
            margin-bottom: 30px;
        }

        .score {
            font-size: 3em;
            color: var(--tag-color);
            margin: 20px 0;
            transition: color 0.3s;
        }

        .result-message {
            color: var(--text-secondary);
            font-size: 1.2em;
            margin-top: 10px;
            transition: color 0.3s;
        }

        .section {
            background: var(--stats-bg);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            transition: background 0.3s;
        }

        .section h3 {
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: color 0.3s;
        }

        .problem-letter {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            margin: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .problem-letter.mild {
            background: var(--problem-mild-bg);
            color: var(--problem-mild-color);
        }

        .problem-letter.severe {
            background: var(--problem-severe-bg);
            color: var(--problem-severe-color);
        }

        .stat-row {
            padding: 10px;
            border-bottom: 1px solid var(--word-list-border);
            display: flex;
            justify-content: space-between;
            transition: border-color 0.3s;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-letter {
            font-weight: bold;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        .stat-value {
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .word-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .word-item {
            padding: 12px;
            border-bottom: 1px solid var(--word-list-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-item.correct {
            border-left: 4px solid var(--word-item-correct);
        }

        .word-item.incorrect {
            border-left: 4px solid var(--word-item-incorrect);
        }

        .emoji {
            font-size: 4em;
            text-align: center;
            margin: 20px 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.3s;
        }

        .mode-selection {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: var(--text-primary);
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            flex: 1;
            min-width: 150px;
        }

        .mode-btn:hover {
            border-color: var(--input-focus);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            border-color: var(--input-focus);
            background: var(--tag-bg);
        }

        .mode-btn-title {
            font-size: 1.2em;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .mode-btn-desc {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 60px;
            }

            .container {
                padding: 20px;
                border-radius: 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 0.95em;
                margin-bottom: 20px;
            }

            .theme-toggle {
                width: 45px;
                height: 45px;
                font-size: 1.3em;
                top: 10px;
                right: 10px;
            }

            .emoji {
                font-size: 3em;
                margin: 15px 0;
            }

            /* Mode selection responsive */
            .mode-selection {
                flex-direction: column;
                gap: 10px;
            }

            .mode-btn {
                min-width: 100%;
                padding: 15px 20px;
                margin: 0;
            }

            /* Word display responsive */
            .word-display {
                font-size: 1.8em;
                margin: 25px 0;
                letter-spacing: 3px;
                word-break: break-word;
            }

            /* Input responsive */
            .input-group {
                margin: 20px 0;
            }

            .input-group label {
                font-size: 1em;
                margin-bottom: 8px;
            }

            .input-group input {
                font-size: 1.8em;
                padding: 15px;
                -webkit-appearance: none;
                -moz-appearance: textfield;
                appearance: none;
            }

            /* Button responsive */
            .btn {
                padding: 14px 30px;
                font-size: 1.1em;
                margin: 15px auto;
                width: 100%;
                max-width: 100%;
                min-height: 48px;
                touch-action: manipulation;
            }

            /* Stats responsive */
            .stats {
                font-size: 0.9em;
                margin-bottom: 15px;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }

            .progress-bar {
                height: 18px;
                margin-bottom: 15px;
            }

            /* Feedback responsive */
            .feedback {
                font-size: 1.1em;
                margin-top: 10px;
                min-height: 30px;
            }

            /* Results responsive */
            .results-summary {
                margin-bottom: 20px;
            }

            .score {
                font-size: 2.5em;
                margin: 15px 0;
            }

            .result-message {
                font-size: 1em;
            }

            /* Word list responsive */
            .word-list {
                max-height: 250px;
                margin-top: 15px;
                -webkit-overflow-scrolling: touch;
            }

            .word-item {
                padding: 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .word-item span:first-child {
                font-size: 1.1em;
            }

            .word-item span:last-child {
                font-size: 0.9em;
            }

            /* Section responsive */
            .section {
                padding: 15px;
                margin: 15px 0;
            }

            .section h3 {
                font-size: 1.1em;
                margin-bottom: 10px;
            }

            /* Problem letter responsive */
            .problem-letter {
                padding: 8px 12px;
                font-size: 1em;
                margin: 3px;
            }

            /* Practice button responsive */
            #practiceErrorsStartBtn {
                width: 100%;
                max-width: 100%;
                font-size: 1.1em;
                padding: 14px 20px;
                margin-bottom: 15px;
                min-height: 48px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
                padding-top: 55px;
            }

            .container {
                padding: 15px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.3em;
            }

            .subtitle {
                font-size: 0.9em;
                margin-bottom: 15px;
            }

            .theme-toggle {
                width: 40px;
                height: 40px;
                font-size: 1.1em;
                top: 8px;
                right: 8px;
            }

            .emoji {
                font-size: 2.5em;
                margin: 10px 0;
            }

            /* Word display smaller */
            .word-display {
                font-size: 1.5em;
                margin: 20px 0;
                letter-spacing: 2px;
            }

            /* Input smaller */
            .input-group {
                margin: 15px 0;
            }

            .input-group label {
                font-size: 0.95em;
            }

            .input-group input {
                font-size: 1.6em;
                padding: 12px;
            }

            /* Button smaller */
            .btn {
                padding: 12px 25px;
                font-size: 1em;
                margin: 12px auto;
                min-height: 44px;
            }

            /* Stats smaller */
            .stats {
                font-size: 0.85em;
                margin-bottom: 10px;
                gap: 5px;
            }

            .progress-bar {
                height: 14px;
                margin-bottom: 10px;
            }

            /* Feedback smaller */
            .feedback {
                font-size: 1em;
                margin-top: 8px;
            }

            /* Results smaller */
            .score {
                font-size: 2em;
                margin: 10px 0;
            }

            .result-message {
                font-size: 0.9em;
            }

            /* Word list smaller */
            .word-list {
                max-height: 200px;
                margin-top: 10px;
            }

            .word-item {
                padding: 10px;
                gap: 5px;
            }

            .word-item span:first-child {
                font-size: 1em;
            }

            .word-item span:last-child {
                font-size: 0.85em;
            }

            /* Section smaller */
            .section {
                padding: 12px;
                margin: 10px 0;
            }

            .section h3 {
                font-size: 1em;
                margin-bottom: 8px;
            }

            /* Mode button smaller */
            .mode-btn {
                padding: 12px 15px;
                min-height: 44px;
            }

            .mode-btn-title {
                font-size: 1.1em;
            }

            .mode-btn-desc {
                font-size: 0.85em;
            }
        }

        /* Touch-friendly improvements */
        @media (hover: none) and (pointer: coarse) {
            .btn {
                min-height: 44px;
            }

            .btn:active {
                transform: translateY(0);
                opacity: 0.9;
            }

            .mode-btn:active {
                transform: translateY(0);
                opacity: 0.9;
            }

            .theme-toggle:active {
                transform: scale(0.95);
            }

            .input-group input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            /* Improve scrolling on mobile */
            .word-list {
                -webkit-overflow-scrolling: touch;
                touch-action: pan-y;
            }

            /* Prevent text selection on buttons */
            .btn,
            .mode-btn,
            .theme-toggle {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
        }

        /* Safe area padding for devices with notches */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
            }

            @media (max-width: 768px) {
                body {
                    padding-left: max(10px, env(safe-area-inset-left));
                    padding-right: max(10px, env(safe-area-inset-right));
                    padding-top: max(60px, env(safe-area-inset-top) + 10px);
                }
            }

            @media (max-width: 480px) {
                body {
                    padding-left: max(5px, env(safe-area-inset-left));
                    padding-right: max(5px, env(safe-area-inset-right));
                    padding-top: max(55px, env(safe-area-inset-top) + 5px);
                }
            }
        }
    </style>
</head>
<body class="dark-theme">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>

    <div class="container">
        <h1>📚 Егэ 9 задание тренажёр</h1>
        <p class="subtitle">Тест на знание гласных в словарных словах</p>

        <div class="start-screen active" id="startScreen">
            <div class="emoji">🎮</div>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; transition: color 0.3s;">
                Вставьте пропущенную гласную букву в слово.<br>
                Система определит ваши слабые места!
            </p>

            <button class="btn" id="practiceErrorsStartBtn" onclick="startPracticeErrors()" style="display: none; margin-bottom: 20px;">🔄 Отработать ошибки</button>

            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 10px; font-weight: bold; transition: color 0.3s;">
                Выберите режим:
            </p>
            <div class="mode-selection">
                <button class="mode-btn active" data-mode="20" onclick="selectMode(this)">
                    <span class="mode-btn-title">Быстрый</span>
                    <span class="mode-btn-desc">20 слов</span>
                </button>
                <button class="mode-btn" data-mode="50" onclick="selectMode(this)">
                    <span class="mode-btn-title">Средний</span>
                    <span class="mode-btn-desc">50 слов</span>
                </button>
                <button class="mode-btn" data-mode="0" onclick="selectMode(this)">
                    <span class="mode-btn-title">Полный</span>
                    <span class="mode-btn-desc">Все слова</span>
                </button>
            </div>
            <button class="btn" id="startGameBtn" onclick="startGame()">Начать игру</button>
            <p id="loadingMessage" style="text-align: center; color: var(--text-secondary); margin-top: 10px; display: none;">
                ⏳ Загрузка словаря...
            </p>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="stats">
                <span>Вопрос: <strong id="currentQuestion">1</strong>/<strong id="totalQuestions">0</strong></span>
                <span>✅ <strong id="correctCount">0</strong></span>
                <span>❌ <strong id="incorrectCount">0</strong></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="word-display" id="wordDisplay"></div>

            <div class="input-group">
                <label for="letterInput">Вставьте пропущенную гласную букву:</label>
                <input type="text" id="letterInput" maxlength="1" autocomplete="off">
            </div>

            <div class="feedback" id="feedback"></div>

            <button class="btn" id="submitBtn" onclick="checkAnswer()">Проверить</button>
            <button class="btn" id="nextBtn" onclick="nextWord()" style="display: none;">Следующее слово</button>
        </div>

        <div class="result-screen" id="resultScreen">
            <div class="emoji" id="resultEmoji"></div>
            <div class="results-summary">
                <h2>Результаты теста</h2>
                <div class="score" id="finalScore"></div>
                <p class="result-message" id="resultMessage"></p>
            </div>
            <button class="btn" onclick="restartGame()">Пройти ещё раз</button>
        </div>
    </div>

    <script>
        // Database of dictionary words with problematic vowels
        // Will be loaded from check_spell_data.txt
        let wordDatabase = [];

        // Parse the check_spell_data.txt file and build wordDatabase
        async function loadWordDatabase() {
            try {
                const response = await fetch('check_spell_data.txt');
                if (!response.ok) {
                    throw new Error('Failed to load check_spell_data.txt');
                }
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim() !== '');

                wordDatabase = lines.map(line => {
                    const [correctWord, pattern] = line.split('=');
                    const trimmedWord = correctWord.trim();
                    const trimmedPattern = pattern.trim();
                    
                    // Find indices where underscores are in the pattern
                    // These indices correspond to the correct word
                    const missingIndices = [];
                    for (let i = 0; i < trimmedPattern.length; i++) {
                        if (trimmedPattern[i] === '_') {
                            missingIndices.push(i);
                        }
                    }
                    
                    // Debug: verify lengths match
                    if (trimmedWord.length !== trimmedPattern.length) {
                        console.warn(`Length mismatch for "${trimmedWord}": word length=${trimmedWord.length}, pattern length=${trimmedPattern.length}`);
                    }
                    
                    return {
                        word: trimmedWord,
                        missingIndices: missingIndices
                    };
                });

                console.log('Loaded', wordDatabase.length, 'words from check_spell_data.txt');
            } catch (error) {
                console.error('Error loading word database:', error);
                // Fallback to empty database if file can't be loaded
                wordDatabase = [];
            }
        }
        
        // Load database on page load
        loadWordDatabase();


        let gameWords = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let letterStats = {};
        let wordResults = [];
        let answered = false;
        let selectedMode = 20;
        let isDarkTheme = false;
        let currentMissingIndices = [];
        let currentWordIndex = 0;
        let errorHistory = []; // Track all errors across sessions

        // Load error history from localStorage
        function loadErrorHistory() {
            try {
                const saved = localStorage.getItem('wordLearningErrors');
                if (saved) {
                    errorHistory = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Failed to load error history:', e);
                errorHistory = [];
            }
        }

        // Save error history to localStorage
        function saveErrorHistory() {
            try {
                localStorage.setItem('wordLearningErrors', JSON.stringify(errorHistory));
            } catch (e) {
                console.error('Failed to save error history:', e);
            }
        }

        // Load error history on startup
        loadErrorHistory();

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleTheme() {
            isDarkTheme = isDarkTheme;
            if (isDarkTheme){
                document.body.classList.toggle('');
                document.getElementById('themeToggle').textContent = '🌙';
            }
            else{
                document.body.classList.toggle('dark-theme');
                document.getElementById('themeToggle').textContent = '☀️';
            }
        }

        function selectMode(btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedMode = parseInt(btn.dataset.mode);
        }

        function getVowels() {
            return ['а', 'о', 'у', 'е', 'ё', 'и', 'я', 'ю', 'э'];
        }

        async function startGame() {
            const startBtn = document.getElementById('startGameBtn');
            const loadingMsg = document.getElementById('loadingMessage');
            
            // Show loading state if database not loaded yet
            if (wordDatabase.length === 0) {
                startBtn.disabled = true;
                loadingMsg.style.display = 'block';
                await loadWordDatabase();
                startBtn.disabled = false;
                loadingMsg.style.display = 'none';
            }
            
            if (wordDatabase.length === 0) {
                alert('Не удалось загрузить словарь. Проверьте наличие файла check_spell_data.txt');
                return;
            }

            // Set flag to indicate we're in normal game mode (not error practice)
            window.isErrorPracticeMode = false;
            
            if (selectedMode === 0) {
                // All words mode
                gameWords = shuffleArray([...wordDatabase]);
            } else {
                gameWords = shuffleArray([...wordDatabase]).slice(0, selectedMode);
            }

            // For each word, pick one random vowel position to hide
            gameWords = gameWords.map(entry => {
                // Pick one index randomly from the missingIndices
                const index = entry.missingIndices[Math.floor(Math.random() * entry.missingIndices.length)];
                return {
                    word: entry.word,
                    hideIndex: index,
                    correctLetter: entry.word[index]
                };
            });

            currentIndex = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            letterStats = {};
            wordResults = [];
            answered = false;

            document.getElementById('totalQuestions').textContent = gameWords.length;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('incorrectCount').textContent = '0';

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');

            displayWord();
        }

        function displayWord() {
            answered = false;
            const entry = gameWords[currentIndex];
            const word = entry.word;
            const hideIndex = entry.hideIndex;

            // Create display word with underscore
            let displayWord = word.substring(0, hideIndex) + '_' + word.substring(hideIndex + 1);

            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('wordDisplay').innerHTML = displayWord.replace('_', '<span class="missing-letter">_</span>');
            document.getElementById('letterInput').value = '';
            document.getElementById('letterInput').className = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('letterInput').disabled = false;
            document.getElementById('letterInput').focus();

            // Update progress bar
            const progress = ((currentIndex) / gameWords.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Store correct answer
            document.getElementById('submitBtn').dataset.correctLetter = entry.correctLetter;
            document.getElementById('submitBtn').dataset.fullWord = word;
            document.getElementById('submitBtn').dataset.hideIndex = hideIndex;
        }

        function checkAnswer() {
            if (answered) return;
            
            const input = document.getElementById('letterInput');
            const userAnswer = input.value.toLowerCase().trim();
            const correctLetter = document.getElementById('submitBtn').dataset.correctLetter.toLowerCase();
            const fullWord = document.getElementById('submitBtn').dataset.fullWord;

            if (!userAnswer) {
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 300);
                return;
            }

            answered = true;
            const isCorrect = userAnswer === correctLetter;

            // Update stats
            if (!letterStats[correctLetter]) {
                letterStats[correctLetter] = { total: 0, correct: 0 };
            }
            letterStats[correctLetter].total++;

            if (isCorrect) {
                letterStats[correctLetter].correct++;
                correctAnswers++;
                input.className = 'correct pulse';
                document.getElementById('feedback').textContent = '✅ Правильно!';
                document.getElementById('feedback').className = 'feedback correct';

                // If in error practice mode and answered correctly, remove from error history
                if (window.isErrorPracticeMode) {
                    const hideIdx = parseInt(document.getElementById('submitBtn').dataset.hideIndex);
                    const errorIndex = errorHistory.findIndex(e => e.word === fullWord && e.hideIndex === hideIdx);
                    if (errorIndex >= 0) {
                        errorHistory.splice(errorIndex, 1);
                        saveErrorHistory();
                    }
                }
            } else {
                incorrectAnswers++;
                input.className = 'incorrect shake';
                document.getElementById('feedback').textContent = '❌ Неправильно! Правильный ответ: ' + fullWord.toUpperCase();
                document.getElementById('feedback').className = 'feedback incorrect';

                const hideIdx = parseInt(document.getElementById('submitBtn').dataset.hideIndex);
                
                // Track error in history with specific hideIndex
                const errorEntry = {
                    word: fullWord,
                    hideIndex: hideIdx,
                    correctLetter: correctLetter,
                    userAnswer: userAnswer,
                    timestamp: Date.now()
                };

                // Check if this word+position already exists in error history
                const existingIndex = errorHistory.findIndex(e => e.word === fullWord && e.hideIndex === hideIdx);
                if (existingIndex >= 0) {
                    // Update existing entry
                    errorHistory[existingIndex].count = (errorHistory[existingIndex].count || 1) + 1;
                    errorHistory[existingIndex].lastError = Date.now();
                    errorHistory[existingIndex].userAnswer = userAnswer;
                } else {
                    // Add new entry
                    errorEntry.count = 1;
                    errorHistory.push(errorEntry);
                }
                saveErrorHistory();
            }

            // Store word result
            wordResults.push({
                word: fullWord,
                correctLetter: correctLetter,
                userAnswer: userAnswer,
                isCorrect: isCorrect
            });

            // Update counters
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;

            // Disable input and show next button
            input.disabled = true;
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= gameWords.length) {
                showResults();
            } else {
                displayWord();
            }
        }

        function showResults() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            const percentage = Math.round((correctAnswers / gameWords.length) * 100);

            // Set emoji and message based on score
            let emoji, message;
            if (percentage >= 90) {
                emoji = '🏆';
                message = 'Отлично! Вы прекрасно знаете словарные слова!';
            } else if (percentage >= 70) {
                emoji = '👍';
                message = 'Хороший результат! Есть над чем поработать.';
            } else if (percentage >= 50) {
                emoji = '📚';
                message = 'Неплохо, но стоит подучить некоторые слова.';
            } else {
                emoji = '💪';
                message = 'Нужно больше практики. Не сдавайтесь!';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('finalScore').textContent = correctAnswers + '/' + gameWords.length + ' (' + percentage + '%)';
            document.getElementById('resultMessage').textContent = message;

            // Show word results
            const wordListDiv = document.getElementById('wordList');
            wordListDiv.innerHTML = '';
            wordResults.forEach(result => {
                const div = document.createElement('div');
                div.className = 'word-item ' + (result.isCorrect ? 'correct' : 'incorrect');
                div.innerHTML = '<span><strong>' + result.word + '</strong></span><span>' +
                    (result.isCorrect ? '✅' : '❌ Ваш ответ: ' + result.userAnswer.toUpperCase() + ', Правильно: ' + result.correctLetter.toUpperCase()) + '</span>';
                wordListDiv.appendChild(div);
            });

            // Update the practice errors button visibility on start screen
            updatePracticeErrorsButton();
        }

        function restartGame() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('active');
            updatePracticeErrorsButton();
        }

        // Update the visibility of the practice errors button on start screen
        function updatePracticeErrorsButton() {
            const practiceBtn = document.getElementById('practiceErrorsStartBtn');
            if (errorHistory.length > 0) {
                practiceBtn.style.display = 'block';
                practiceBtn.textContent = '🔄 Отработать ошибки (' + errorHistory.length + ')';
            } else {
                practiceBtn.style.display = 'none';
            }
        }

        // Start practicing only error words
        function startPracticeErrors() {
            if (errorHistory.length === 0) {
                alert('Нет ошибок для отработки!');
                return;
            }

            // Create game words from error history using the SPECIFIC hideIndex that was wrong
            gameWords = errorHistory.map(error => {
                return {
                    word: error.word,
                    hideIndex: error.hideIndex,
                    correctLetter: error.word[error.hideIndex]
                };
            });

            if (gameWords.length === 0) {
                alert('Не удалось найти слова для отработки');
                return;
            }

            // Shuffle
            gameWords = shuffleArray(gameWords);

            currentIndex = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            letterStats = {};
            wordResults = [];
            answered = false;
            window.isErrorPracticeMode = true;

            document.getElementById('totalQuestions').textContent = gameWords.length;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('incorrectCount').textContent = '0';

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');

            displayWord();
        }

        // Update practice button when page loads
        updatePracticeErrorsButton();

        // Handle Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('gameScreen').classList.contains('active')) {
                    if (!answered) {
                        checkAnswer();
                    } else {
                        nextWord();
                    }
                }
            }
        });
    </script>
</body>
</html>
