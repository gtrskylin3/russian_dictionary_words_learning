<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Словарный тренажёр</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body class="dark-theme">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>

    <div class="container">
        <h1>📚 ЕГЭ 9 задание тренажёр</h1>
        <p class="subtitle">Тест на знание гласных в словарных словах</p>

        <div class="start-screen active" id="startScreen">
            <div class="emoji">🎮</div>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; transition: color 0.3s;">
                Вставьте пропущенную гласную букву в слово.<br>
                Система определит ваши слабые места!
            </p>

            <button class="btn" id="practiceErrorsStartBtn" onclick="startPracticeErrors()" style="display: none; margin-bottom: 20px;">🔄 Отработать ошибки</button>

            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 10px; font-weight: bold; transition: color 0.3s;">
                Выберите режим:
            </p>
            <div class="mode-selection">
                <button class="mode-btn active" data-mode="20" onclick="selectMode(this)">
                    <span class="mode-btn-title">Быстрый</span>
                    <span class="mode-btn-desc">20 слов</span>
                </button>
                <button class="mode-btn" data-mode="50" onclick="selectMode(this)">
                    <span class="mode-btn-title">Средний</span>
                    <span class="mode-btn-desc">50 слов</span>
                </button>
                <button class="mode-btn" data-mode="0" onclick="selectMode(this)">
                    <span class="mode-btn-title">Полный</span>
                    <span class="mode-btn-desc">Все слова</span>
                </button>
            </div>
            <button class="btn" id="startGameBtn" onclick="startGame()">Начать игру</button>
            <p id="loadingMessage" style="text-align: center; color: var(--text-secondary); margin-top: 10px; display: none;">
                ⏳ Загрузка словаря...
            </p>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="stats">
                <span>Вопрос: <strong id="currentQuestion">1</strong>/<strong id="totalQuestions">0</strong></span>
                <span>✅ <strong id="correctCount">0</strong></span>
                <span>❌ <strong id="incorrectCount">0</strong></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="word-display" id="wordDisplay"></div>
            <div class="word-hint" id="wordHint"></div>

            <div class="input-group">
                <label for="letterInput">Вставьте пропущенную гласную букву:</label>
                <input type="text" id="letterInput" maxlength="1" autocomplete="off">
            </div>

            <div class="layout-warning" id="layoutWarning">⚠️ Переключите раскладку на русскую!</div>

            <div class="feedback" id="feedback"></div>

            <button class="btn" id="submitBtn" onclick="checkAnswer()">Проверить</button>
            <button class="btn" id="nextBtn" onclick="nextWord()" style="display: none;">Следующее слово</button>
        </div>

        <div class="result-screen" id="resultScreen">
            <div class="emoji" id="resultEmoji"></div>
            <div class="results-summary">
                <h2>Результаты теста</h2>
                <div class="score" id="finalScore"></div>
                <p class="result-message" id="resultMessage"></p>
            </div>
            <button class="btn" onclick="restartGame()">Пройти ещё раз</button>
        </div>
    </div>

    <script>
        // Database of dictionary words with problematic vowels
        // Will be loaded from check_spell_data.txt
        let wordDatabase = [];

        // Parse the check_spell_data.txt file and build wordDatabase
        async function loadWordDatabase() {
            try {
                const response = await fetch('check_spell_data.txt');
                if (!response.ok) {
                    throw new Error('Failed to load check_spell_data.txt');
                }
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim() !== '');

                wordDatabase = lines.map(line => {
                    const [correctWord, patternWithHint] = line.split('=');
                    const trimmedWord = correctWord.trim();
                    let trimmedPattern = patternWithHint.trim();
                    let hint = '';

                    // Check if pattern contains hint in parentheses
                    const hintMatch = trimmedPattern.match(/^(.+?)\s*\((.+?)\)$/);
                    if (hintMatch) {
                        trimmedPattern = hintMatch[1].trim();
                        hint = hintMatch[2].trim();
                    }

                    // Find indices where underscores are in the pattern
                    // These indices correspond to the correct word
                    const missingIndices = [];
                    for (let i = 0; i < trimmedPattern.length; i++) {
                        if (trimmedPattern[i] === '_') {
                            missingIndices.push(i);
                        }
                    }

                    // Debug: verify lengths match
                    if (trimmedWord.length !== trimmedPattern.length) {
                        console.warn(`Length mismatch for "${trimmedWord}": word length=${trimmedWord.length}, pattern length=${trimmedPattern.length}`);
                    }

                    return {
                        word: trimmedWord,
                        missingIndices: missingIndices,
                        hint: hint
                    };
                });

                console.log('Loaded', wordDatabase.length, 'words from check_spell_data.txt');
                console.log('Words with hints:', wordDatabase.filter(w => w.hint).length);
            } catch (error) {
                console.error('Error loading word database:', error);
                // Fallback to empty database if file can't be loaded
                wordDatabase = [];
            }
        }
        
        // Load database on page load
        loadWordDatabase();


        let gameWords = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let letterStats = {};
        let wordResults = [];
        let answered = false;
        let selectedMode = 20;
        let isDarkTheme = false;
        let currentMissingIndices = [];
        let currentWordIndex = 0;
        let errorHistory = []; // Track all errors across sessions

        // Load error history from localStorage
        function loadErrorHistory() {
            try {
                const saved = localStorage.getItem('wordLearningErrors');
                if (saved) {
                    errorHistory = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Failed to load error history:', e);
                errorHistory = [];
            }
        }

        // Save error history to localStorage
        function saveErrorHistory() {
            try {
                localStorage.setItem('wordLearningErrors', JSON.stringify(errorHistory));
            } catch (e) {
                console.error('Failed to save error history:', e);
            }
        }

        // Load error history on startup
        loadErrorHistory();

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            
            if (isDarkTheme) {
                // Switch to dark theme
                document.body.classList.add('dark-theme');
                document.getElementById('themeToggle').textContent = '☀️';
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1a2e');
            } else {
                // Switch to light theme
                document.body.classList.remove('dark-theme');
                document.getElementById('themeToggle').textContent = '🌙';
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#667eea');
            }
        }

        function selectMode(btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedMode = parseInt(btn.dataset.mode);
        }

        function getVowels() {
            return ['а', 'о', 'у', 'е', 'ё', 'и', 'я', 'ю', 'э'];
        }

        async function startGame() {
            const startBtn = document.getElementById('startGameBtn');
            const loadingMsg = document.getElementById('loadingMessage');
            
            // Show loading state if database not loaded yet
            if (wordDatabase.length === 0) {
                startBtn.disabled = true;
                loadingMsg.style.display = 'block';
                await loadWordDatabase();
                startBtn.disabled = false;
                loadingMsg.style.display = 'none';
            }
            
            if (wordDatabase.length === 0) {
                alert('Не удалось загрузить словарь. Проверьте наличие файла check_spell_data.txt');
                return;
            }

            // Set flag to indicate we're in normal game mode (not error practice)
            window.isErrorPracticeMode = false;
            
            if (selectedMode === 0) {
                // All words mode
                gameWords = shuffleArray([...wordDatabase]);
            } else {
                gameWords = shuffleArray([...wordDatabase]).slice(0, selectedMode);
            }

            // For each word, pick one random vowel position to hide
            gameWords = gameWords.map(entry => {
                // Pick one index randomly from the missingIndices
                const index = entry.missingIndices[Math.floor(Math.random() * entry.missingIndices.length)];
                return {
                    word: entry.word,
                    hideIndex: index,
                    correctLetter: entry.word[index],
                    hint: entry.hint || ''
                };
            });

            currentIndex = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            letterStats = {};
            wordResults = [];
            answered = false;

            document.getElementById('totalQuestions').textContent = gameWords.length;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('incorrectCount').textContent = '0';

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');

            displayWord();
        }

        function displayWord() {
            answered = false;
            const entry = gameWords[currentIndex];
            const word = entry.word;
            const hideIndex = entry.hideIndex;
            const hint = entry.hint;

            // Create display word with underscore
            let displayWord = word.substring(0, hideIndex) + '_' + word.substring(hideIndex + 1);

            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('wordDisplay').innerHTML = displayWord.replace('_', '<span class="missing-letter">_</span>');
            
            // Show hint if available
            const hintElement = document.getElementById('wordHint');
            if (hint) {
                hintElement.textContent = '(' + hint + ')';
            } else {
                hintElement.textContent = '';
            }
            
            document.getElementById('letterInput').value = '';
            document.getElementById('letterInput').className = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('letterInput').disabled = false;
            document.getElementById('letterInput').focus();

            // Update progress bar
            const progress = ((currentIndex) / gameWords.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Store correct answer
            document.getElementById('submitBtn').dataset.correctLetter = entry.correctLetter;
            document.getElementById('submitBtn').dataset.fullWord = word;
            document.getElementById('submitBtn').dataset.hideIndex = hideIndex;
        }

        function checkAnswer() {
            if (answered) return;
            
            const input = document.getElementById('letterInput');
            const userAnswer = input.value.toLowerCase().trim();
            const correctLetter = document.getElementById('submitBtn').dataset.correctLetter.toLowerCase();
            const fullWord = document.getElementById('submitBtn').dataset.fullWord;

            if (!userAnswer) {
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 300);
                return;
            }

            answered = true;
            const isCorrect = userAnswer === correctLetter;

            // Update stats
            if (!letterStats[correctLetter]) {
                letterStats[correctLetter] = { total: 0, correct: 0 };
            }
            letterStats[correctLetter].total++;

            if (isCorrect) {
                letterStats[correctLetter].correct++;
                correctAnswers++;
                input.className = 'correct pulse';
                document.getElementById('feedback').textContent = '✅ Правильно!';
                document.getElementById('feedback').className = 'feedback correct';

                // If in error practice mode and answered correctly, remove from error history
                if (window.isErrorPracticeMode) {
                    const hideIdx = parseInt(document.getElementById('submitBtn').dataset.hideIndex);
                    const errorIndex = errorHistory.findIndex(e => e.word === fullWord && e.hideIndex === hideIdx);
                    if (errorIndex >= 0) {
                        errorHistory.splice(errorIndex, 1);
                        saveErrorHistory();
                    }
                }
            } else {
                incorrectAnswers++;
                input.className = 'incorrect shake';
                document.getElementById('feedback').textContent = '❌ Неправильно! Правильный ответ: ' + fullWord.toUpperCase();
                document.getElementById('feedback').className = 'feedback incorrect';

                const hideIdx = parseInt(document.getElementById('submitBtn').dataset.hideIndex);
                
                // Track error in history with specific hideIndex
                const errorEntry = {
                    word: fullWord,
                    hideIndex: hideIdx,
                    correctLetter: correctLetter,
                    userAnswer: userAnswer,
                    timestamp: Date.now()
                };

                // Check if this word+position already exists in error history
                const existingIndex = errorHistory.findIndex(e => e.word === fullWord && e.hideIndex === hideIdx);
                if (existingIndex >= 0) {
                    // Update existing entry
                    errorHistory[existingIndex].count = (errorHistory[existingIndex].count || 1) + 1;
                    errorHistory[existingIndex].lastError = Date.now();
                    errorHistory[existingIndex].userAnswer = userAnswer;
                } else {
                    // Add new entry
                    errorEntry.count = 1;
                    errorHistory.push(errorEntry);
                }
                saveErrorHistory();
            }

            // Store word result
            wordResults.push({
                word: fullWord,
                correctLetter: correctLetter,
                userAnswer: userAnswer,
                isCorrect: isCorrect
            });

            // Update counters
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;

            // Disable input and show next button
            input.disabled = true;
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= gameWords.length) {
                showResults();
            } else {
                displayWord();
            }
        }

        function showResults() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            const percentage = Math.round((correctAnswers / gameWords.length) * 100);

            // Set emoji and message based on score
            let emoji, message;
            if (percentage >= 90) {
                emoji = '🏆';
                message = 'Отлично! Вы прекрасно знаете словарные слова!';
            } else if (percentage >= 70) {
                emoji = '👍';
                message = 'Хороший результат! Есть над чем поработать.';
            } else if (percentage >= 50) {
                emoji = '📚';
                message = 'Неплохо, но стоит подучить некоторые слова.';
            } else {
                emoji = '💪';
                message = 'Нужно больше практики. Не сдавайтесь!';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('finalScore').textContent = correctAnswers + '/' + gameWords.length + ' (' + percentage + '%)';
            document.getElementById('resultMessage').textContent = message;

            // Show word results
            const wordListDiv = document.getElementById('wordList');
            wordListDiv.innerHTML = '';
            wordResults.forEach(result => {
                const div = document.createElement('div');
                div.className = 'word-item ' + (result.isCorrect ? 'correct' : 'incorrect');
                div.innerHTML = '<span><strong>' + result.word + '</strong></span><span>' +
                    (result.isCorrect ? '✅' : '❌ Ваш ответ: ' + result.userAnswer.toUpperCase() + ', Правильно: ' + result.correctLetter.toUpperCase()) + '</span>';
                wordListDiv.appendChild(div);
            });

            // Update the practice errors button visibility on start screen
            updatePracticeErrorsButton();
        }

        function restartGame() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('active');
            updatePracticeErrorsButton();
        }

        // Update the visibility of the practice errors button on start screen
        function updatePracticeErrorsButton() {
            const practiceBtn = document.getElementById('practiceErrorsStartBtn');
            if (errorHistory.length > 0) {
                practiceBtn.style.display = 'block';
                practiceBtn.textContent = '🔄 Отработать ошибки (' + errorHistory.length + ')';
            } else {
                practiceBtn.style.display = 'none';
            }
        }

        // Start practicing only error words
        function startPracticeErrors() {
            if (errorHistory.length === 0) {
                alert('Нет ошибок для отработки!');
                return;
            }

            // Create game words from error history using the SPECIFIC hideIndex that was wrong
            gameWords = errorHistory.map(error => {
                // Find hint from database
                const dbEntry = wordDatabase.find(w => w.word === error.word);
                return {
                    word: error.word,
                    hideIndex: error.hideIndex,
                    correctLetter: error.word[error.hideIndex],
                    hint: dbEntry ? dbEntry.hint : ''
                };
            });

            if (gameWords.length === 0) {
                alert('Не удалось найти слова для отработки');
                return;
            }

            // Shuffle
            gameWords = shuffleArray(gameWords);

            currentIndex = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            letterStats = {};
            wordResults = [];
            answered = false;
            window.isErrorPracticeMode = true;

            document.getElementById('totalQuestions').textContent = gameWords.length;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('incorrectCount').textContent = '0';

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');

            displayWord();
        }

        // Update practice button when page loads
        updatePracticeErrorsButton();

        // Detect English layout and show warning
        const letterInputEl = document.getElementById('letterInput');
        const layoutWarningEl = document.getElementById('layoutWarning');
        
        if (letterInputEl && layoutWarningEl) {
            letterInputEl.addEventListener('input', function() {
                const value = this.value;
                if (!value) {
                    layoutWarningEl.classList.remove('visible');
                    return;
                }

                // Check if the character is a Latin letter (English layout)
                const isLatinLetter = /[a-zA-Z]/.test(value);
                
                if (isLatinLetter) {
                    layoutWarningEl.classList.add('visible');
                } else {
                    layoutWarningEl.classList.remove('visible');
                }
            });

            letterInputEl.addEventListener('focus', function() {
                // Clear warning when input gains focus
                layoutWarningEl.classList.remove('visible');
            });

            letterInputEl.addEventListener('blur', function() {
                // Clear warning when input loses focus
                layoutWarningEl.classList.remove('visible');
            });
        }

        // Handle Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('gameScreen').classList.contains('active')) {
                    if (!answered) {
                        checkAnswer();
                    } else {
                        nextWord();
                    }
                }
            }
        });
    </script>
</body>
</html>
